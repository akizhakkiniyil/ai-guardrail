repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/semgrep/semgrep
    rev: v1.90.0
    hooks:
      - id: semgrep
        args: ["--config", "p/java", "--config", ".semgrep/", "--error", "--quiet"]

  - repo: local
    hooks:
      - id: spotless-check
        name: spotless-check
        entry: mvn -q -B spotless:check
        language: system
        pass_filenames: false
        files: \.java$
      - id: hallucinated-dep-check
        name: hallucinated-dependency-check
        entry: bash ci/check-dependencies-exist.sh
        language: system
        pass_filenames: false
        files: pom\.xml$
      - id: commit-msg-ai-trailer
        name: require-ai-usage-trailer
        stages: [commit-msg]
        entry: bash ci/check-ai-trailer.sh
        language: system
